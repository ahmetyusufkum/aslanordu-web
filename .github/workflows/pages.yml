name: GitHub Pages'e yayinla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v6

      - name: GitHub Pages'i hazirla
        uses: actions/configure-pages@v5

      - name: Site dosyalarini paketle
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - name: Siteyi yayinla
        id: deployment
        uses: actions/deploy-pages@v4
